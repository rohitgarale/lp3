const practicals = [

{
    name: "Fibonacci.cpp",
    code: `#include <iostream>
using namespace std;

// Recursive Fibonacci function
long long fibonacciRecursive(int n) {
    if (n <= 1) {
        return n;
    }

    return fibonacciRecursive(n - 1) +
           fibonacciRecursive(n - 2);
}

// Non-recursive Fibonacci function
void fibonacciIterative(int n) {
    long long first = 0, second = 1, next;

    cout << "Non-Recursive Fibonacci: ";

    for (int i = 0; i < n; i++) {
        cout << first << " ";

        next = first + second;
        first = second;
        second = next;
    }

    cout << endl;
}

int main() {
    int n;

    cout << "Enter number of terms: ";
    cin >> n;

    if (n < 0 || n > 40) {
        cout << "Please enter a number between 0 and 40.";
        return 0;
    }

    fibonacciIterative(n);

    cout << "Recursive Fibonacci: ";

    for (int i = 0; i < n; i++) {
        cout << fibonacciRecursive(i) << " ";
    }

    cout << endl;

    return 0;
}

/*
Time Complexity:
Recursive: O(2^n)
Iterative: O(n)

Space Complexity:
Recursive: O(n) due to call stack
Iterative: O(1)
*/`
},

{
    name: "Huffman.cpp",
    code: `#include <iostream>
#include <queue>
#include <vector>
#include <string>
using namespace std;

// Structure for Huffman Tree Node
struct Node {
    char data;
    int frequency;
    Node *left, *right;

    Node(char ch, int freq) {
        data = ch;
        frequency = freq;
        left = right = nullptr;
    }
};

// Compare nodes by frequency
struct Compare {
    bool operator()(Node* a, Node* b) {
        return a->frequency > b->frequency;
    }
};

// Generate Huffman Codes
void generateCodes(Node* root, string code) {
    if (root == nullptr) {
        return;
    }

    // Leaf node
    if (root->left == nullptr &&
        root->right == nullptr) {

        cout << root->data << " : ";
        cout << (code.empty() ? "0" : code) << endl;

        return;
    }

    generateCodes(root->left, code + "0");
    generateCodes(root->right, code + "1");
}

int main() {
    int n;

    cout << "Enter number of characters: ";
    cin >> n;

    if (n <= 0) {
        cout << "Invalid number of characters.";
        return 0;
    }

    priority_queue<Node*, vector<Node*>, Compare> pq;

    char ch;
    int freq;

    // Read characters and frequencies
    for (int i = 0; i < n; i++) {

        cout << "Enter character and frequency: ";
        cin >> ch >> freq;

        if (freq <= 0) {
            cout << "Frequency must be positive.";
            return 0;
        }

        pq.push(new Node(ch, freq));
    }

    // Build Huffman Tree using greedy strategy
    while (pq.size() > 1) {

        Node* left = pq.top();
        pq.pop();

        Node* right = pq.top();
        pq.pop();

        Node* newNode = new Node(
            '$',
            left->frequency + right->frequency
        );

        newNode->left = left;
        newNode->right = right;

        pq.push(newNode);
    }

    Node* root = pq.top();

    cout << "\\nHuffman Codes:\\n";

    generateCodes(root, "");

    return 0;
}

/*
Time Complexity: O(n log n)
Space Complexity: O(n)
*/`
},

{
    name: "FractionalKnapsack.cpp",
    code: `#include <iostream>
#include <algorithm>
#include <iomanip>
using namespace std;

struct Item {
    int profit;
    int weight;
    double ratio;
};

// Sort items by profit/weight ratio
bool compare(Item a, Item b) {
    return a.ratio > b.ratio;
}

int main() {
    int n, capacity;

    cout << "Enter number of items: ";
    cin >> n;

    if (n <= 0 || n > 100) {
        cout << "Enter number of items between 1 and 100.";
        return 0;
    }

    Item items[100];

    cout << "Enter profit and weight of each item:\\n";

    for (int i = 0; i < n; i++) {

        cin >> items[i].profit >> items[i].weight;

        if (items[i].profit < 0 ||
            items[i].weight <= 0) {

            cout << "Invalid profit or weight.";
            return 0;
        }

        items[i].ratio =
            (double)items[i].profit / items[i].weight;
    }

    cout << "Enter knapsack capacity: ";
    cin >> capacity;

    if (capacity < 0) {
        cout << "Invalid capacity.";
        return 0;
    }

    // Sort in descending order of ratio
    sort(items, items + n, compare);

    double totalProfit = 0.0;
    int remainingCapacity = capacity;

    // Fill the knapsack
    for (int i = 0; i < n; i++) {

        if (remainingCapacity == 0) {
            break;
        }

        // Take the complete item
        if (items[i].weight <= remainingCapacity) {

            remainingCapacity -= items[i].weight;
            totalProfit += items[i].profit;
        }

        // Take a fraction of the item
        else {

            double fraction =
                (double)remainingCapacity / items[i].weight;

            totalProfit += items[i].profit * fraction;
            remainingCapacity = 0;
        }
    }

    cout << fixed << setprecision(2);

    cout << "\\nMaximum Profit: "
         << totalProfit << endl;

    return 0;
}

/*
Time Complexity: O(n log n)
Space Complexity: O(n) for the items array
*/`
},

{
    name: "Knapsack01.cpp",
    code: `#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

int main() {
    int n, capacity;

    cout << "Enter number of items: ";
    cin >> n;

    if (n <= 0 || n > 100) {
        cout << "Enter number of items between 1 and 100.";
        return 0;
    }

    vector<int> weight(n + 1);
    vector<int> profit(n + 1);

    cout << "Enter weight and profit of each item:\\n";

    for (int i = 1; i <= n; i++) {

        cin >> weight[i] >> profit[i];

        if (weight[i] <= 0 || profit[i] < 0) {
            cout << "Invalid weight or profit.";
            return 0;
        }
    }

    cout << "Enter knapsack capacity: ";
    cin >> capacity;

    if (capacity < 0 || capacity > 10000) {
        cout << "Enter capacity between 0 and 10000.";
        return 0;
    }

    // DP table: rows represent items, columns represent capacity
    vector<vector<int>> dp(
        n + 1,
        vector<int>(capacity + 1, 0)
    );

    // Fill the DP table
    for (int i = 1; i <= n; i++) {

        for (int w = 0; w <= capacity; w++) {

            // Cannot include item if it is too heavy
            if (weight[i] > w) {

                dp[i][w] = dp[i - 1][w];
            }

            else {

                // Choose maximum of including or excluding item
                dp[i][w] = max(
                    dp[i - 1][w],
                    profit[i] + dp[i - 1][w - weight[i]]
                );
            }
        }
    }

    cout << "\\nMaximum Profit: "
         << dp[n][capacity] << endl;

    // Find which items were selected
    cout << "Selected item numbers: ";

    int w = capacity;
    bool selected = false;

    for (int i = n; i >= 1; i--) {

        if (dp[i][w] != dp[i - 1][w]) {

            cout << i << " ";

            selected = true;

            w -= weight[i];
        }
    }

    if (!selected) {
        cout << "None";
    }

    cout << endl;

    return 0;
}

/*
Time Complexity: O(n * W)
Space Complexity: O(n * W)

where:
n = number of items
W = knapsack capacity
*/`
},

{
    name: "NQueens.cpp",
    code: `#include <iostream>
#include <vector>
using namespace std;

// Check whether a Queen can be placed safely
bool isSafe(vector<vector<int>>& board,
            int row, int col, int n) {

    // Check the same column in previous rows
    for (int i = 0; i < row; i++) {

        if (board[i][col] == 1) {
            return false;
        }
    }

    // Check upper-left diagonal
    for (int i = row - 1, j = col - 1;
         i >= 0 && j >= 0; i--, j--) {

        if (board[i][j] == 1) {
            return false;
        }
    }

    // Check upper-right diagonal
    for (int i = row - 1, j = col + 1;
         i >= 0 && j < n; i--, j++) {

        if (board[i][j] == 1) {
            return false;
        }
    }

    return true;
}

// Solve N-Queens using backtracking
bool solveNQueens(vector<vector<int>>& board,
                  int row, int n) {

    // All Queens have been placed
    if (row == n) {
        return true;
    }

    // Try each column in the current row
    for (int col = 0; col < n; col++) {

        if (isSafe(board, row, col, n)) {

            // Place Queen
            board[row][col] = 1;

            // Move to the next row
            if (solveNQueens(board, row + 1, n)) {
                return true;
            }

            // Backtrack: remove Queen
            board[row][col] = 0;
        }
    }

    return false;
}

int main() {
    int n, firstRow, firstCol;

    cout << "Enter number of Queens: ";
    cin >> n;

    if (n <= 0 || n > 15) {
        cout << "Please enter N between 1 and 15.";
        return 0;
    }

    // The first Queen is fixed in row 0.
    // Enter row and column using 0-based indexing.
    cout << "Enter first Queen row and column (0 to "
         << n - 1 << "): ";

    cin >> firstRow >> firstCol;

    // The first Queen must be in row 0
    if (firstRow != 0 ||
        firstCol < 0 ||
        firstCol >= n) {

        cout << "Invalid position. Enter row 0 and a column "
             << "between 0 and " << n - 1 << ".";

        return 0;
    }

    // Create an N x N chessboard
    vector<vector<int>> board(
        n, vector<int>(n, 0)
    );

    // Place the first Queen at the given position
    board[firstRow][firstCol] = 1;

    // Solve the remaining rows
    if (solveNQueens(board, firstRow + 1, n)) {

        cout << "\\nFinal N-Queens Matrix:\\n";

        for (int i = 0; i < n; i++) {

            for (int j = 0; j < n; j++) {

                if (board[i][j] == 1) {
                    cout << "Q ";
                }
                else {
                    cout << ". ";
                }
            }

            cout << endl;
        }
    }

    else {

        cout << "\\nNo solution exists with the given "
             << "first Queen position.";
    }

    return 0;
}

/*
Time Complexity: O(N!) upper bound
Space Complexity: O(N^2) for the board
Recursion Stack: O(N)
*/`
}

];

    download.className = "download";
    download.textContent = "Download File";

    const blob = new Blob([practical.code], {
        type: "text/plain;charset=utf-8"

    const url = URL.createObjectURL(blob);

    download.href = url;
    download.download = practical.name;

    card.appendChild(codeBox);
    card.appendChild(download);

    container.appendChild(card);
